name: campha_moblie
description: "Ứng dụng MobileGIS phục vụ quản lý bản đồ và hiện trường thành phố Cẩm Phả."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management / DI — providers viết tay, KHÔNG dùng riverpod_generator
  # (dự án này không sinh file .g.dart).
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Network
  dio: ^5.7.0

  # Storage — sqflite thay cho drift vì drift bắt buộc build_runner (.g.dart).
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  geolocator: ^13.0.2

  # Utils
  uuid: 4.6.0
  intl: ^0.20.2
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.1.1
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  url_launcher: ^6.3.1
  mapbox_maps_flutter: 2.28.0
  share_plus: ^12.0.2
  image_picker: 1.2.1
  image: ^4.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/OFL.txt
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
